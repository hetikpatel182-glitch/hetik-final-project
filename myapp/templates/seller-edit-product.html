{% extends 'seller-header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    
</head>

<body>

   

    <!-- Single Page Header start -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6 wow fadeInUp" data-wow-delay="0.1s">Edit Product</h1>
        <ol class="breadcrumb justify-content-center mb-0 wow fadeInUp" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Product</a></li>
            <li class="breadcrumb-item active text-white">Edit Product</li>
        </ol>
    </div>
    <!-- Single Page Header End -->

    <!-- Contucts Start -->
    <div class="container-fluid contact py-5">
        <div class="container py-5">
            <div class="p-5 bg-light rounded">
                <div class="row g-4">
                   
                    <div class="col-lg-12">
                       {% if msg %}
                           <b style="color: blue;">{{msg}}</b>
                        {% endif %}
                        <form method="post" action="{% url 'seller-edit-product' pk=product.pk %}" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="row g-4 wow fadeInUp" data-wow-delay="0.1s">
                                <div class="col-lg-12 col-xl-12">
                                    <div class="form-floating">
                                        <select name="product_category" class="form-control" id="name">
                                            {% if product.product_category == "Mobile" %}
                                                <option>---Select Product Category---</option>
                                                <option value="Mobile" selected>Mobile</option>
                                                <option value="Electronics">Electronics</option>
                                            {% elif product.product_category == "Electronics"%}
                                                <option>---Select Product Category---</option>
                                                <option value="Mobile">Mobile</option>
                                                <option value="Electronics" selected>Electronics</option>
                                            {% endif %}
                                            
                                        </select>
                                       
                                    </div>
                                </div>
                                <div class="col-lg-12 col-xl-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="name" name="product_name" value="{{product.product_name}}">
                                        <label for="name">Your Product Name</label>
                                    </div>
                                </div>
                                <div class="col-lg-12 col-xl-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="name" name="product_price" value="{{product.product_price}}">
                                        <label for="name">Your Product Price</label>
                                    </div>
                                </div> 
                                <div class="col-12">
                                    <div class="form-floating">
                                        <textarea class="form-control" name="product_desc" placeholder="Product Details" id="message" style="height: 160px">{{product.product_desc}}</textarea>
                                        <label for="message">Product Details</label>
                                    </div>
                                </div>
                                <div class="col-lg-12 col-xl-6">
                                   <img src="{{product.product_picture.url}}" style="width: 100px;height: 100px;border-radius: 50%;">
                                </div>
                                <div class="col-lg-12 col-xl-6">
                                    <div class="form-floating">
                                        <input type="file" class="form-control" id="phone" name="product_picture">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <button class="btn btn-primary w-100 py-3">Update Product</button>
                                </div>
                            </div>
                        </form>
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </div>
    <!-- Contuct End -->
</body>
</html>
{% endblock %}
