<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signing in with Google...</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 10% 20%, rgba(243,246,255,1) 0%, rgba(234,240,255,1) 90%);
        }
        .loader-card {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(13,110,253,0.1);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { color: #1e293b; margin: 0 0 8px; font-size: 1.2rem; }
        p  { color: #64748b; margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="loader-card">
    <div class="spinner"></div>
    <h2>Signing you in...</h2>
    <p>Please wait while we verify your Google account.</p>
</div>

<script>
    // Read access_token from URL fragment (e.g. #access_token=xxx)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const error = params.get('error');

    function getCookie(name) {
        let value = null;
        if (document.cookie) {
            document.cookie.split(';').forEach(c => {
                c = c.trim();
                if (c.startsWith(name + '=')) value = decodeURIComponent(c.split('=')[1]);
            });
        }
        return value;
    }

    if (error || !accessToken) {
        window.location.href = '/login/?msg=Google+sign-in+was+cancelled';
    } else {
        // Verify token & get user info from Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => {
            if (!r.ok) throw new Error('Failed to get user info');
            return r.json();
        })
        .then(userInfo => {
            // Send user info to Django backend
            return fetch('/google-login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    access_token: accessToken,
                    email: userInfo.email,
                    fname: userInfo.given_name || 'Google',
                    lname: userInfo.family_name || 'User',
                    picture: userInfo.picture || ''
                })
            });
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = data.redirect_url;
            } else {
                window.location.href = '/login/?msg=' + encodeURIComponent(data.message || 'Login failed');
            }
        })
        .catch(err => {
            console.error('Google login error:', err);
            window.location.href = '/login/?msg=Google+sign-in+failed';
        });
    }
</script>
</body>
</html>
